name: Apply Realms

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - '.github/actions/post-terraform-comment/**'
      - '.github/actions/setup-terraform/**'
      - '.github/workflows/realms-apply.yml'
      - 'realms/*.yaml'
      - 'schemas/*'
      - 'scripts/actions-helpers.js'
      - 'scripts/detect-changed-realms.sh'
      - 'terraform/**/*'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  realm-matrix:
    name: Realm matrix
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged == true }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - id: set-matrix
        name: Determine realm matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: scripts/detect-changed-realms.sh
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  apply:
    name: Apply realm
    runs-on: ubuntu-latest
    needs: [realm-matrix]
    if: ${{ github.event.pull_request.merged == true && needs.realm-matrix.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        realm: ${{ fromJSON(needs.realm-matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: terraform/realms/${{ matrix.realm }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: post apply comment (started)
        continue-on-error: true
        uses: ./.github/actions/post-terraform-comment
        with:
          command: apply
          config: ${{ matrix.realm }}
          pr-number: ${{ github.event.pull_request.number }}
          steps-json: '[{"name":"init","outcome":"pending"},{"name":"apply"}]'
      - uses: ./.github/actions/setup-terraform
        with:
          realm: ${{ matrix.realm }}
          aws-role-arn: ${{ vars.AWS_APPLY_ROLE_ARN }}
      - name: init
        id: init
        run: terraform init -no-color 2>&1 | tee /tmp/${{ github.run_id }}.init.txt
      - name: post apply comment (after init)
        if: ${{ always() }}
        continue-on-error: true
        uses: ./.github/actions/post-terraform-comment
        env:
          STEP_INIT_OUTCOME: ${{ steps.init.outcome }}
        with:
          command: apply
          config: ${{ matrix.realm }}
          pr-number: ${{ github.event.pull_request.number }}
          steps-json: '[{"name":"init"},{"name":"apply","outcome":"pending"}]'
      - name: apply
        id: apply
        run: |
          aws s3 cp \
            s3://backstage-terraform-plan-outputs/${{ github.repository }}/${{ github.event.pull_request.number }}/${{ matrix.realm }}.out \
            plan.out \
            --profile backstage
          terraform apply -no-color plan.out 2>&1 | tee /tmp/${{ github.run_id }}.apply.txt
      - name: cleanup
        if: ${{ always() }}
        run: |
          aws s3 rm \
            s3://backstage-terraform-plan-outputs/${{ github.repository }}/${{ github.event.pull_request.number }}/${{ matrix.realm }}.out \
            --profile backstage
      - name: post apply comment (final)
        if: ${{ always() }}
        continue-on-error: true
        uses: ./.github/actions/post-terraform-comment
        env:
          STEP_INIT_OUTCOME: ${{ steps.init.outcome }}
          STEP_APPLY_OUTCOME: ${{ steps.apply.outcome }}
        with:
          command: apply
          config: ${{ matrix.realm }}
          pr-number: ${{ github.event.pull_request.number }}
          steps-json: '[{"name":"init"},{"name":"apply"}]'
