name: Plan Realms

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/actions/post-terraform-comment/**'
      - '.github/actions/setup-terraform/**'
      - '.github/workflows/realms-plan.yml'
      - 'realms/*.yaml'
      - 'schemas/*'
      - 'scripts/actions-helpers.js'
      - 'scripts/detect-changed-realms.sh'
      - 'terraform/**/*'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  realm-matrix:
    name: Realm matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: set-matrix
        name: Determine realm matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/detect-changed-realms.sh
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  plan:
    name: Plan realm
    runs-on: ubuntu-latest
    needs: [realm-matrix]
    if: ${{ needs.realm-matrix.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        realm: ${{ fromJSON(needs.realm-matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: terraform/realms/${{ matrix.realm }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-terraform
        with:
          realm: ${{ matrix.realm }}
          aws-role-arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
      - name: validate config
        id: validate-config
        run: |
          npx --yes ajv-cli@5.0.0 validate \
            -s ../../../schemas/realm.json \
            -d ../../../realms/${{ matrix.realm }}.yaml 2>&1 | tee /tmp/${{ github.run_id }}.validate-config.txt
      - name: init
        id: init
        run: terraform init -no-color 2>&1 | tee /tmp/${{ github.run_id }}.init.txt
      - name: fmt check
        id: fmt-check
        run: terraform fmt -check -recursive -no-color 2>&1 | tee /tmp/${{ github.run_id }}.fmt-check.txt
      - name: validate
        id: validate
        run: terraform validate -no-color 2>&1 | tee /tmp/${{ github.run_id }}.validate.txt
      - name: plan
        id: plan
        run: terraform plan -no-color -lock=false -out=plan.out 2>&1 | tee /tmp/${{ github.run_id }}.plan.txt
      - name: upload plan output
        run: |
          aws s3 cp \
            plan.out \
            s3://backstage-terraform-plan-outputs/${{ github.repository }}/${{ github.event.pull_request.number }}/${{ matrix.realm }}.out \
            --profile backstage
      - name: post plan comment
        if: always()
        uses: ./.github/actions/post-terraform-comment
        env:
          STEP_VALIDATE_CONFIG_OUTCOME: ${{ steps.validate-config.outcome }}
          STEP_INIT_OUTCOME: ${{ steps.init.outcome }}
          STEP_FMT_CHECK_OUTCOME: ${{ steps.fmt-check.outcome }}
          STEP_VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          STEP_PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          command: plan
          config: ${{ matrix.realm }}
          pr-number: ${{ github.event.pull_request.number }}
          steps-json: '[{"name":"validate-config","label":"config validation"},{"name":"init"},{"name":"fmt-check"},{"name":"validate"},{"name":"plan"}]'
