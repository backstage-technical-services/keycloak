name: Post Terraform PR comment
description: Build and upsert a terraform plan/apply PR comment

inputs:
  command:
    description: terraform command (plan or apply)
    required: true
  config:
    description: realm name (e.g. prod or nonprod)
    required: true
  steps-json:
    description: JSON array of step definitions
    required: true
  pr-number:
    description: PR number to post the comment on
    required: true

runs:
  using: composite
  steps:
    - name: build comment
      id: build-comment
      uses: actions/github-script@v9
      env:
        STEPS_JSON: ${{ inputs.steps-json }}
      with:
        github-token: ${{ github.token }}
        result-encoding: string
        script: |
          const { buildComment } = require('./scripts/actions-helpers.js');
          const steps = JSON.parse(process.env.STEPS_JSON);

          return buildComment({
            context,
            core,
            command: '${{ inputs.command }}',
            configName: '${{ inputs.config }}',
            steps,
          });

    - name: post comment
      continue-on-error: true
      uses: thollander/actions-comment-pull-request@v3
      with:
        file-path: ${{ steps.build-comment.outputs.result }}
        comment-tag: ${{ inputs.command }}-${{ inputs.config }}
        mode: upsert
        pr-number: ${{ inputs.pr-number }}
